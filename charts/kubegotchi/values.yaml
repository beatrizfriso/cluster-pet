petName: Pipoca
# How much each stat drops per minute
decayPerMinute: 2
# 1 replica on purpose: the pet's state lives in the pod's memory, so with
# 2+ replicas each pod would be a different pet (feed one, query another).
# In Phase 4 the state comes from Prometheus (/vitals), the app becomes
# stateless and can scale. Try bumping it to 2 and see the problem.
replicaCount: 1

# Disabled for the same reason as replicaCount: with 2+ replicas the state
# splits. Turn it on to see the problem; it becomes truly useful in Phase 4.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # % of requests.cpu (50m): above ~30m per pod, the HPA scales out
  targetCPUUtilizationPercentage: 60

# Published by CI (.github/workflows/ci.yaml). Argo CD deploys whatever tag is
# here, so changing it in a commit is how a new version reaches the cluster.
image:
  repository: ghcr.io/beatrizfriso/kubegotchi
  tag: sha-844e85e
  pullPolicy: IfNotPresent

service:
  port: 80

# Traefik ships with k3s; k3d exposes it on localhost:8080 (k3d/cluster.yaml)
ingress:
  enabled: true
  className: traefik
  # Empty accepts any host. E.g. "kubegotchi.localhost" to route by name
  host: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# "Mistreat" the pet on purpose (Phase 3 onward)
chaos:
  latencyMs: 0
  errorRate: 0

# Per-route app metrics, used to diagnose which endpoint burns the SLO.
# The SLOs themselves are measured at Traefik (gitops/monitoring/).
serviceMonitor:
  enabled: true
  interval: 15s
  # label that the kube-prometheus-stack Prometheus looks for
  release: monitoring
