petName: Pipoca
# How much each stat drops per minute
decayPerMinute: 2

# The pod holds no state: stats are computed from the care history
# (kubegotchi_actions_total) in Prometheus over a sliding window, so every
# replica answers with the same pet. With no care for a whole window, a stat
# reaches 0. If Prometheus is unreachable, /status answers 503.
care:
  prometheusUrl: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  windowMinutes: 60
  # Must match gitops/monitoring/slos/pet-availability.yaml: /vitals turns the
  # error budget left into the pet's health
  sloAvailabilityTarget: 0.99

# Safe to scale since Phase 4 (stateless). Still 1 until the HPA is enabled.
replicaCount: 1

# Turned on in a later Phase 4 step, now that replicas share the same pet
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # % of requests.cpu (50m): above ~30m per pod, the HPA scales out
  targetCPUUtilizationPercentage: 60

# Published by CI (.github/workflows/ci.yaml). Argo CD deploys whatever tag is
# here, so changing it in a commit is how a new version reaches the cluster.
image:
  repository: ghcr.io/beatrizfriso/kubegotchi
  tag: sha-c0c8951
  pullPolicy: IfNotPresent

service:
  port: 80

# Traefik ships with k3s; k3d exposes it on localhost:8080 (k3d/cluster.yaml)
ingress:
  enabled: true
  className: traefik
  # Empty accepts any host. E.g. "kubegotchi.localhost" to route by name
  host: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # 250m throttled the container in ~18% of CFS periods (CPUThrottlingHigh)
    # and made startup slow enough for liveness to kill it
    cpu: 500m
    memory: 128Mi

# "Mistreat" the pet on purpose (Phase 3 onward)
chaos:
  latencyMs: 0
  errorRate: 0

# Per-route app metrics, used to diagnose which endpoint burns the SLO.
# The SLOs themselves are measured at Traefik (gitops/monitoring/).
serviceMonitor:
  enabled: true
  interval: 15s
  # label that the kube-prometheus-stack Prometheus looks for
  release: monitoring
