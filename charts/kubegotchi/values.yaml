petName: Bolinha
# Quanto cada status cai por minuto
decayPerMinute: 2
# 1 réplica de propósito: o estado do bichinho vive na memória do pod, então
# com 2+ réplicas cada pod seria um bichinho diferente (alimenta um, consulta
# outro). Na Fase 4 o estado passa a vir do Prometheus (/vitals), o app fica
# stateless e aí dá para escalar. Experimente subir para 2 e ver o problema.
replicaCount: 1

# Desligado pelo mesmo motivo do replicaCount: com 2+ réplicas o estado se
# divide. Ligue para ver o problema; vira útil de verdade na Fase 4.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # % do requests.cpu (50m): acima de ~30m por pod, o HPA escala
  targetCPUUtilizationPercentage: 60

image:
  repository: kubegotchi
  tag: dev
  pullPolicy: IfNotPresent

service:
  port: 80

# Traefik já vem no k3s; o k3d expõe ele em localhost:8080 (k3d/cluster.yaml)
ingress:
  enabled: true
  className: traefik
  # Vazio aceita qualquer host. Ex.: "kubegotchi.localhost" para separar por nome
  host: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# "Maltratar" o bichinho de propósito (Fase 3 em diante)
chaos:
  latencyMs: 0
  errorRate: 0

# Ligue na Fase 3, depois de instalar o kube-prometheus-stack
serviceMonitor:
  enabled: false
  interval: 15s
  # label que o Prometheus do kube-prometheus-stack procura
  release: monitoring
