apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: kubegotchi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # With the HPA on, it owns the replica count; if the chart set it too,
  # every helm upgrade would reset it to replicaCount
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubegotchi
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubegotchi
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: pet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PET_NAME
              value: {{ .Values.petName | quote }}
            - name: DECAY_PER_MINUTE
              value: {{ .Values.decayPerMinute | quote }}
            # The pet's care history: stats are computed from it, so the pod holds no state
            - name: PROMETHEUS_URL
              value: {{ .Values.care.prometheusUrl | quote }}
            - name: CARE_WINDOW_MINUTES
              value: {{ .Values.care.windowMinutes | quote }}
            - name: CHAOS_LATENCY_MS
              value: {{ .Values.chaos.latencyMs | quote }}
            - name: CHAOS_ERROR_RATE
              value: {{ .Values.chaos.errorRate | quote }}
            # Lets /status show which image is running (handy to watch deploys and rollbacks)
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          # Liveness and readiness only start once this passes, so a slow start
          # (Python under CPU throttling) gets up to 60s instead of being killed
          # by liveness after 30s. Found by the Phase 3 chaos experiment.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
