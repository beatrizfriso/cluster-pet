# Kubegotchi local cluster
# Create:  k3d cluster create --config k3d/cluster.yaml
# Delete:  k3d cluster delete kubegotchi
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kubegotchi
servers: 1
agents: 2
ports:
  # Traefik ingress (ships with k3s) exposed on localhost:8080
  - port: 8080:80
    nodeFilters:
      - loadbalancer
