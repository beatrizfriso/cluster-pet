# Steady background traffic so the SLIs have volume. Replaced by k6 in Phase 4.
# Scale to 0 to pause it: change replicas here in a PR (selfHeal reverts kubectl scale).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owners
  labels:
    app.kubernetes.io/name: owners
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: owners
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owners
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: owners
          image: curlimages/curl:8.11.1
          command: ["sh", "/scripts/owners.sh"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: owners-script
