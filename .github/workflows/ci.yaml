# CI básico: valida o chart e faz build da imagem.
# Na Fase 2 você vai estender isso para publicar a imagem e atualizar a tag
# que o Argo CD observa.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio por padrão; cada job pede só o que precisa
permissions:
  contents: read

jobs:
  # Quebra o build se alguma secret for commitada (em qualquer commit, não só no último)
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lista os commits do PR via API
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # comentar no PR exigiria pull-requests: write; o job falhando já basta
          GITLEAKS_ENABLE_COMMENTS: false

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint charts/kubegotchi

      # Sem isso o pip tenta instalar no Python do sistema e falha (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes unitários
        run: |
          pip install -r app/requirements-dev.txt
          cd app && pytest -v

      - name: Smoke test do app
        run: |
          cd app && (uvicorn main:app --port 8000 &)
          # espera o app subir em vez de um sleep fixo
          curl -sf --retry 15 --retry-delay 1 --retry-connrefused localhost:8000/status
          curl -sf -X POST localhost:8000/feed
          curl -sf localhost:8000/metrics | grep kubegotchi_stat

      - name: Docker build
        run: docker build -t kubegotchi:${{ github.sha }} app
