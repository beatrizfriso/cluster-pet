# Basic CI: validates the chart and builds the image.
# In Phase 2 you'll extend this to publish the image and bump the tag
# that Argo CD watches.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; each job asks only for what it needs
permissions:
  contents: read

jobs:
  # Fails the build if any secret is committed (in any commit, not just the last one)
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the PR commits through the API
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # commenting on the PR would need pull-requests: write; a failing job is enough
          GITLEAKS_ENABLE_COMMENTS: false

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint charts/kubegotchi

      # Without this pip tries to install into the system Python and fails (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install -r app/requirements-dev.txt
          cd app && pytest -v

      - name: App smoke test
        run: |
          cd app && (uvicorn main:app --port 8000 &)
          # wait for the app to come up instead of a fixed sleep
          curl -sf --retry 15 --retry-delay 1 --retry-connrefused localhost:8000/status
          curl -sf -X POST localhost:8000/feed
          curl -sf localhost:8000/metrics | grep kubegotchi_stat

      - name: Docker build
        run: docker build -t kubegotchi:${{ github.sha }} app
