# CI: validates the chart and the app on every PR; on main and on v* tags it
# also scans and publishes the image to ghcr.io.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; each job asks only for what it needs
permissions:
  contents: read

jobs:
  # Fails the build if any secret is committed (in any commit, not just the last one)
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the PR commits through the API
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # commenting on the PR would need pull-requests: write; a failing job is enough
          GITLEAKS_ENABLE_COMMENTS: false

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint charts/kubegotchi

      # Without this pip tries to install into the system Python and fails (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install -r app/requirements-dev.txt
          cd app && pytest -v

      - name: App smoke test
        run: |
          cd app && (uvicorn main:app --port 8000 &)
          # wait for the app to come up instead of a fixed sleep
          curl -sf --retry 15 --retry-delay 1 --retry-connrefused localhost:8000/status
          curl -sf -X POST localhost:8000/feed
          curl -sf localhost:8000/metrics | grep kubegotchi_stat

      - name: Docker build
        run: docker build -t kubegotchi:${{ github.sha }} app

  # Only after everything above passes, and never on PRs (forks can't push)
  publish:
    if: github.event_name == 'push'
    needs: [secrets, lint-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kubegotchi
    steps:
      - uses: actions/checkout@v4

      # Third-party actions pinned by commit SHA: a moved tag can't change what runs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> sha-abc1234 (what Argo CD deploys); tag v0.2.0 -> 0.2.0 (release).
      # No "latest": a tag that moves makes it impossible to know what is running.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      # Build into the local Docker first so the scan runs before anything is pushed
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Same inputs + warm cache: this only pushes the layers built above
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
