# Public demo on GitHub Pages: the same frontend the app serves, replaying a
# recording of a real chaos experiment (there's no cluster behind Pages).
# Requires Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["app/static/**", ".github/workflows/pages.yaml"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same layout the app serves: index.html at the root, assets under static/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp app/static/index.html _site/
          cp -r app/static _site/static
          # plain static files, no Jekyll processing
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
